[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "check-added-large-files" }, { id = "check-case-conflict" }, { id = "check-executables-have-shebangs" }, { id = "check-yaml" }, { id = "check-json" }, { id = "check-merge-conflict" }, { id = "destroyed-symlinks" }, { id = "end-of-file-fixer" }, { id = "mixed-line-ending" }, { id = "trailing-whitespace" }]

[[repos]]
repo = "https://github.com/zrr1999/zendev"
rev = "v0.5.0"
hooks = [{ id = "zendev-message-check", args = ["--profile", "zendev"] }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.9.0"
hooks = [{ id = "tombi-format", exclude = '^Cargo\.lock$' }, { id = "tombi-lint" }]
